[module]
default_controller = main
default_action = index
default_theme = base


[module.information]
name = "Payment"
type = "Core Module"
description = "Payment Gateways and Memberships."
version = "1.0.1"
author = "Pierre-Henry Soria"
company = "pH7Software"
license = "MIT"
website = "https://ph7builder.com"
email = "hello@ph7builder.com"


[module.setting]
; --- General ---
currency_code = USD
currency_sign = "$"

; TAX/VAT in percentage
vat_rate = 0

; Log files
log_file.enabled = 1


;  --- GATEWAYS ---
; Sandbox (for test)
sandbox.enabled = 1

; -- Gateways list --

; PayPal
paypal.enabled = 0
paypal.email = ""

; Stripe: unavailable in 18.6.0 until the legacy flow is migrated to Checkout Sessions or Payment Intents.
stripe.enabled = 0
stripe.publishable_key = ""
stripe.secret_key = ""

; Braintree
braintree.enabled = 0
braintree.merchant_id = ""
braintree.public_key = ""
braintree.private_key = ""

; 2Checkout: unavailable in 18.6.0 until the legacy flow is migrated to API 6.0.
2co.enabled = 0
2co.vendor_id = ""
2co.secret_word = ""

; In developing... Feel free to contribute on Github: https://github.com/pH7Software/pH7-Social-Dating-CMS
; ccbill.enabled = 0
; ccbill.vendor_account_number = 0000
; ccbill.vendor_subaccount_number = 0000
