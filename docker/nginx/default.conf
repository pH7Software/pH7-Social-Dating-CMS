server {
    listen 80 default_server;
    server_name localhost;

    if ($host != localhost) {
        return 444;
    }

    root /var/www;
    index index.php;
    client_max_body_size 50M;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/(?:_protected|_repository|_tests|_tools|docker|\.git|\.github)(?:/|$) {
        return 404;
    }

    location ~ ^/_install/(?:data|vendor)(?:/|$) {
        return 404;
    }

    location ~* ^/data/.+\.(?:jpe?g|png|gif|webp|mp3|mp4|flv|webm)$ {
        try_files $uri =404;
    }

    location ~ ^/data(?:/|$) {
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* (?:^|/)composer\.(?:json|lock)$ {
        return 404;
    }

    location ~* ^/(?:sample\.htaccess|nginx\.conf|Dockerfile|docker-compose\.yml|php(?:unit|cs)\.xml\.dist|error_log)$ {
        return 404;
    }

    location ~* ^/(?!\.well-known/security\.txt$|humans\.txt$|robots\.txt$|(?:app-)?ads\.txt$).+\.(?:cgi|pl|py|sh|bash|sql|tpl|ini|cache|log|lock|tmp|txt|md|bak)$ {
        return 404;
    }

    location = /index.php {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_MOD_REWRITE On;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass php:9000;
    }

    location = /_install/index.php {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_MOD_REWRITE On;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass php:9000;
    }

    location ~ \.php$ {
        return 404;
    }
}
