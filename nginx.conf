server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;
}

server {
    listen 80;
    listen [::]:80;

    server_name example.com www.example.com;
    root /var/www/ph7builder_public_root;
    index index.php;
    client_max_body_size 50M;
    server_tokens off;

    error_log /var/log/nginx/yoursite.error.log;
    access_log /var/log/nginx/yoursite.access.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Never expose application internals or development tooling.
    location ~ ^/(?:_protected|_repository|_tests|_tools|docker|\.git|\.github)(?:/|$) {
        return 404;
    }

    # The installer UI is public until setup is complete; its data and libraries are not.
    location ~ ^/_install/(?:data|vendor)(?:/|$) {
        return 404;
    }

    # User-controlled storage serves media only, matching data/.htaccess.
    location ~* ^/data/.+\.(?:jpe?g|png|gif|webp|mp3|mp4|flv|webm)$ {
        try_files $uri =404;
    }

    location ~ ^/data(?:/|$) {
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* (?:^|/)composer\.(?:json|lock)$ {
        return 404;
    }

    location ~* ^/(?:sample\.htaccess|nginx\.conf|Dockerfile|docker-compose\.yml|php(?:unit|cs)\.xml\.dist|error_log)$ {
        return 404;
    }

    location ~* ^/(?!\.well-known/security\.txt$|humans\.txt$|robots\.txt$|(?:app-)?ads\.txt$).+\.(?:cgi|pl|py|sh|bash|sql|tpl|ini|cache|log|lock|tmp|txt|md|bak)$ {
        return 404;
    }

    # pH7Builder routes every application request through these two front controllers.
    location = /index.php {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_MOD_REWRITE On;
        fastcgi_hide_header X-Powered-By;
        # Adjust this socket when the server uses another supported PHP-FPM version.
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    location = /_install/index.php {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_MOD_REWRITE On;
        fastcgi_hide_header X-Powered-By;
        # Adjust this socket when the server uses another supported PHP-FPM version.
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }
}
