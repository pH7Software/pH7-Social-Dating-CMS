name: Tests

on: [ push, pull_request ]

jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ 'ubuntu-latest' ]
        php-versions: [ '8.2', '8.3', '8.4', '8.5' ]
        phpunit-version: [ '9.6' ]
    name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: phpunit:${{ matrix.phpunit-version }}, composer:v2
          extensions: curl, dom, exif, gd, hash, json, libxml, zip, zlib, mbstring, pdo_mysql, bcmath, gmp
          coverage: xdebug

      - name: Validate Composer json/lock
        run: composer validate --strict

      - name: Get Composer Cache Directory
        id: composer-cache
        shell: bash
        run: |
          dir="$(composer config cache-files-dir)"
          if [ -z "$dir" ]; then
            dir="$HOME/.composer/cache/files"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --no-progress

      - name: Run Unit Tests (CI Suite)
        run: php -d error_reporting="E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED" _protected/vendor/bin/phpunit --testsuite "pH7Builder Protected CI"
