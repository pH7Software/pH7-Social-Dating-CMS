version: "2"

services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/
      - ./sites:/etc/nginx/conf.d
      - ./nginx.conf:/etc/nginx/ph7builder.conf
    depends_on:
      - php
    links:
      - php
  php:
    image: php:8.2.0-fpm
    volumes:
      - .:/var/www/
    command: bash -c "composer install"
    working_dir: /var/www/
  db:
    # Pinned so a "latest" pull can't jump to a new MySQL major (e.g. 9's auth/SQL-mode changes) and break the dev DB
    image: mysql:8.4
    ports:
      - "8001:3306"
